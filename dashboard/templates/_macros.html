{% macro chansel(name, grouped, selected=None, allow_none=True, multiple=False, empty_label='Not set') -%}
<select class="uk-select" name="{{ name }}" {% if multiple %}multiple size="8"{% endif %}>
  {% if allow_none and not multiple %}<option value="">{{ empty_label }}</option>{% endif %}
  {% for label, channels in grouped %}
    <optgroup label="{{ label }}">
      {% for c in channels %}
        <option value="{{ c.id }}" {% if multiple %}{% if c.id in selected %}selected{% endif %}{% else %}{% if selected == c.id %}selected{% endif %}{% endif %}>#{{ c.name }}</option>
      {% endfor %}
    </optgroup>
  {% endfor %}
</select>
{%- endmacro %}
